<!doctype html>
<html>
  <head>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121212;
        }
      }

      body {
        margin: 0;
        background-color: var(--background);
        background-image: url("Frontyard.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-image: url("Night.webp");
        }
      }

      #btn-tema {
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 4px 6px;
        background: none;
        border: none;
        cursor: pointer;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
        transition: transform 0.15s;
      }

      #btn-tema:hover {
        transform: scale(1.1) rotate(-4deg);
      }

      #btn-tema[aria-pressed="true"] {
        transform: translateY(2px);
      }
    </style>
  </head>
  <body>
    <svg
      width="100%"
      height="100vh"
      viewBox="0 0 600 600"
      preserveAspectRatio="xMidYMid meet"
    >
      <title>GIRASSOLE</title>
      <desc>THE ZOMBIES ARE COMING</desc>

      <rect id="fundo" x="0" y="0" width="10000" height="10000" fill="none" />

      <path
        id="caule-baixo"
        d="M300 500 L300 435"
        stroke="green"
        fill="none"
        stroke-width="10"
      />

      <defs>
        <path
          id="petala"
          d="M0 0
             Q25 -100, 50 0"
          fill="yellow"
        />

        <path
          id="folha"
          d="M0 0
             C25 -35, 65 -45, 85 -30
             C65 0, 30 10, 0 0 Z"
          fill="green"
          stroke="black"
        />

        <path
          id="olho_fundo"
          d="M -2 -21 L 2 -21 Q 11 -21 11 -10 L 11 11 Q 11 21 0 21 Q -11 21 -11 11 L -11 -10 Q -11 -21 -2 -21 Z"
          fill="black"
          stroke-linejoin="round"
        />

        <g
          fill="url(#corPetala)"
          stroke="#ad1457"
          stroke-width="2"
          id="conjunto"
        >
          <use
            href="#petala"
            transform="rotate(-10 245 230) translate(220, 235)"
          />
          <use
            href="#petala"
            transform="rotate(-27 245 230) translate(168, 227)"
          />
          <use
            href="#petala"
            transform="rotate(-60 245 230) translate(135, 190)"
          />
        </g>
      </defs>

      <g id="parte-superior">
        <path
          id="caule-cima"
          d="M300 435 L300 370"
          stroke="green"
          fill="none"
          stroke-width="10"
        />

      <g id="cabeca" transform="scale(1 1.2) translate(0 -50)">

        <g id="flor" fill="url(#corPetala)" stroke="#ad1457" stroke-width="2">
          <!-- cima -->
          <use href="#petala" transform="translate(275, 230)" />
          <use href="#conjunto" transform="translate(600, 600) scale(-1)" />
          <use href="#conjunto" transform="scale(1 -1) translate(0, -600)" />
          <use href="#conjunto" transform="scale(-1 1) translate(-600, 0)" />
          <use href="#conjunto" />
          <!-- baixo -->
          <use href="#petala" transform="translate(325, 370) scale(-1)" />
        </g>

        <ellipse cx="300" cy="300" rx="150" ry="70" fill="brown" />
        <path
          id="boca"
          d="M205 310 Q300 400 425 310"
          stroke="black"
          fill="none"
          stroke-width="6"
        />

        <!-- olhos -->
        <use href="#olho_fundo" transform="translate(250, 275)" />
        <use href="#olho_fundo" transform="translate(350, 275)" />

        <circle cx="245" cy="265" r="4" fill="white" />
        <circle cx="345" cy="265" r="4" fill="white" />
      </g>

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 300 435; 4 300 435; 0 300 435; -4 300 435; 0 300 435"
        dur="3s"
        repeatCount="indefinite"
      />
      </g>

      <use href="#folha" transform="translate(300, 500)" />
      <use href="#folha" transform="translate(300, 500) rotate(20)" />
      <use href="#folha" transform="scale(-1 1) translate(-300 500)" />
      <use href="#folha" transform="scale(-1 1) translate(-300 500) rotate(20)" />
    </svg>

    <audio id="tema" src="theme.mp3" loop preload="auto"></audio>
    <button id="btn-tema" type="button" aria-pressed="false" aria-label="Play theme" title="Play theme">
      <svg id="icone-lapide" viewBox="0 0 48 56" width="44" height="52" aria-hidden="true">
        <ellipse cx="24" cy="51" rx="21" ry="4" fill="#2e7d32" opacity="0.8" />
        <path d="M7 50 L7 20 Q7 4 24 4 Q41 4 41 20 L41 50 Z" fill="#9e9e9e" stroke="#37474f" stroke-width="3" stroke-linejoin="round" />
        <path d="M12 48 L12 21 Q12 10 22 9" fill="none" stroke="#cfd8dc" stroke-width="2.5" stroke-linecap="round" />
        <path id="icone-play" d="M18 17 L33 28 L18 39 Z" fill="#455a64" stroke="#455a64" stroke-width="3" stroke-linejoin="round" />
        <path id="icone-pausa" d="M18 18 L18 38 M30 18 L30 38" stroke="#455a64" stroke-width="5" stroke-linecap="round" display="none" />
      </svg>
    </button>
    <script>
      const audio = document.getElementById("tema");
      const btn = document.getElementById("btn-tema");
      btn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });

      const startOnInteraction = (ev) => {
        if (btn.contains(ev.target)) return;
        ["pointerdown", "keydown", "touchstart"].forEach((e) =>
          document.removeEventListener(e, startOnInteraction)
        );
        if (audio.paused) audio.play().catch(() => {});
      };
      window.addEventListener("load", () => {
        audio.play().catch(() => {
          ["pointerdown", "keydown", "touchstart"].forEach((e) =>
            document.addEventListener(e, startOnInteraction)
          );
        });
      });
      audio.addEventListener("play", () => {
        btn.title = "Pause theme";
        btn.setAttribute("aria-label", "Pause theme");
        btn.setAttribute("aria-pressed", "true");
        document.getElementById("icone-pausa").removeAttribute("display");
        document.getElementById("icone-play").setAttribute("display", "none");
      });
      audio.addEventListener("pause", () => {
        btn.title = "Play theme";
        btn.setAttribute("aria-label", "Play theme");
        btn.setAttribute("aria-pressed", "false");
        document.getElementById("icone-pausa").setAttribute("display", "none");
        document.getElementById("icone-play").removeAttribute("display");
      });
    </script>
  </body>
  <html></html>
</html>
